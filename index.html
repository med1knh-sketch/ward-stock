<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>สต็อกวัสดุ · อายุรกรรมชาย 1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mali:wght@500;600;700&family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fff7fb; --card:#fff; --ink:#4a3f55; --muted:#756a82; --line:#f0e6f4;
  --lav:#e8defc; --lav-d:#8e6df0; --lav-dd:#6d4fd6; --pink:#ffdbea; --mint:#d6f5e5; --peach:#ffe8d4; --sky:#dcefff; --butter:#fff3c6;
  --danger:#e0476a; --danger-bg:#ffe3e8; --warn:#b97400; --warn-bg:#fff1d3; --ok:#1f9d6c; --ok-bg:#dcf7ea; --info:#2f7fd8; --info-bg:#e1efff;
  --r:18px; --shadow:0 4px 14px rgba(142,109,240,.10);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;font-family:'Sarabun','Noto Sans Thai',system-ui,sans-serif;color:var(--ink);background:var(--bg);font-size:16px;line-height:1.45}
h1,h2,h3,.ttl,.btn,.menu b{font-family:'Mali','Sarabun',system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px 120px}
.top{position:sticky;top:0;z-index:20;background:rgba(255,247,251,.94);backdrop-filter:blur(6px);border-bottom:1px solid var(--line)}
.top-in{max-width:720px;margin:0 auto;padding:10px 14px;display:flex;align-items:center;gap:10px}
.ttl{font-size:19px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font-size:12px;color:var(--muted);text-align:right;line-height:1.2}
.sync.on b{color:var(--ok)} .sync.off b{color:var(--danger)}
.icon-btn{width:40px;height:40px;border-radius:14px;border:0;background:var(--lav);font-size:24px;line-height:1;padding:0 0 3px}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin:10px 0}
.card h3{margin:0 0 8px;font-size:17px}
.muted{color:var(--muted)} .small{font-size:13px}
.hello{background:linear-gradient(135deg,var(--pink),var(--lav));border-radius:22px;padding:16px 16px 14px;margin:6px 0 10px}
.hello h1{margin:0;font-size:22px} .hello p{margin:4px 0 0;font-size:14px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat{border:0;border-radius:var(--r);padding:12px 14px;text-align:left;box-shadow:var(--shadow)}
.stat .n{font-family:'Mali';font-size:30px;font-weight:700;line-height:1.1}
.stat .l{font-size:14px}
.stat.need{background:var(--danger-bg)} .stat.near{background:var(--butter)} .stat.ok{background:var(--mint)} .stat.unknown{background:#efecf5}
.menu{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.menu button{border:0;border-radius:var(--r);padding:14px 10px;text-align:center;box-shadow:var(--shadow);position:relative;min-height:92px}
.menu .e{font-size:30px;display:block} .menu b{font-size:16px;display:block;margin-top:2px} .menu small{color:var(--muted);font-size:12px}
.m1{background:var(--lav)} .m2{background:var(--peach)} .m3{background:var(--mint)} .m4{background:var(--pink)} .m5{background:var(--sky)} .m6{background:var(--butter)} .m7{background:#efecf5}
.pill{position:absolute;top:8px;right:8px;background:var(--danger);color:#fff;border-radius:999px;font-size:12px;font-weight:700;padding:1px 8px;min-width:22px}
.btn{border:0;border-radius:14px;padding:11px 16px;font-weight:600;background:var(--lav);min-height:44px}
.btn.primary{background:var(--lav-d);color:#fff;box-shadow:0 4px 12px rgba(142,109,240,.35)}
.btn.danger{background:var(--danger-bg);color:var(--danger)} .btn.ghost{background:#f4effa}
.btn.block{width:100%} .btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:12px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:14px;min-height:36px}
.chip.on{background:var(--lav-d);border-color:var(--lav-d);color:#fff;font-weight:600}
.seg{display:flex;background:#f4effa;border-radius:14px;padding:4px;gap:4px;margin-bottom:10px}
.seg button{flex:1;border:0;background:transparent;border-radius:11px;padding:9px 4px;font-weight:600;min-height:42px}
.seg button.on{background:#fff;color:var(--lav-dd);box-shadow:0 2px 8px rgba(142,109,240,.2)}
input,select,textarea{font:inherit;font-size:16px;color:var(--ink);border:1.5px solid #e4d8f0;background:#fff;border-radius:13px;padding:10px 12px;width:100%;min-height:44px}
input:focus,select:focus{outline:2px solid var(--lav-d);border-color:var(--lav-d)}
.search{margin:2px 0 6px}
.item{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:16px;padding:12px;margin:8px 0;box-shadow:var(--shadow);border-left:6px solid #e4d8f0}
.item.s-out,.item.s-low{border-left-color:var(--danger)} .item.s-near{border-left-color:#f5b94a} .item.s-ok{border-left-color:#4ccb9a}
.item.s-over{border-left-color:#5aa9ff} .item.s-unknown{border-left-color:#c9c0d6} .item.s-inactive{opacity:.55}
.item-main{flex:1;min-width:0}
.nm{font-weight:600;word-break:break-word} .sub{font-size:12.5px;color:var(--muted);word-break:break-word}
.mm{font-size:13px;color:var(--muted);margin-top:4px}
.qbox{text-align:right;min-width:92px}
.qbox .q{font-family:'Mali';font-size:24px;font-weight:700;line-height:1.1} .qbox .u{font-size:12.5px;color:var(--muted)}
.qty{width:108px;flex:0 0 auto;text-align:center}
.qty input{text-align:center;font-weight:700;font-size:18px;padding:8px 6px}
.diff{display:block;font-size:12.5px;margin-top:3px;min-height:18px;font-weight:600}
.diff.eq{color:var(--ok)} .diff.up{color:var(--info)} .diff.down{color:var(--danger)} .diff.init{color:var(--muted)}
.badge{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:2px 9px;margin-top:3px;white-space:nowrap}
.s-out.badge,.s-low.badge{background:var(--danger-bg);color:var(--danger)} .s-near.badge{background:var(--warn-bg);color:var(--warn)}
.s-ok.badge{background:var(--ok-bg);color:var(--ok)} .s-over.badge{background:var(--info-bg);color:var(--info)}
.s-unknown.badge{background:#efecf5;color:var(--muted)} .s-inactive.badge{background:#eee;color:#666}
.bar{position:relative;height:9px;border-radius:99px;background:#f1eaf7;margin:8px 0 2px;overflow:visible}
.bar i{display:block;height:100%;border-radius:99px;background:#4ccb9a}
.bar.b-out i,.bar.b-low i{background:#ff8fa3} .bar.b-near i{background:#f5b94a} .bar.b-over i{background:#5aa9ff}
.bar u{position:absolute;top:-3px;width:3px;height:15px;background:var(--ink);border-radius:2px;opacity:.55;text-decoration:none}
.foot{position:fixed;left:0;right:0;bottom:0;z-index:25;padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,rgba(255,247,251,0))}
.foot-in{max-width:720px;margin:0 auto;display:flex;gap:10px}
.row{display:flex;gap:10px;align-items:center}
.grow{flex:1;min-width:0}
.hd{font-family:'Mali';font-weight:700;margin:16px 2px 4px;font-size:15px;color:var(--lav-dd)}
.empty{text-align:center;color:var(--muted);padding:26px 10px}
.stepper{display:flex;align-items:center;gap:6px}
.stepper button{width:38px;height:38px;border-radius:12px;border:0;background:var(--lav);font-size:20px;font-weight:700;padding:0}
.stepper input{width:70px;text-align:center;font-weight:700;padding:6px}
.sw{position:relative;display:inline-block;width:46px;height:26px;flex:0 0 auto}
.sw input{opacity:0;width:100%;height:100%;position:absolute;inset:0;margin:0;cursor:pointer;z-index:1;min-height:0}
.sw span{position:absolute;inset:0;border-radius:99px;background:#d9d0e4;transition:.15s}
.sw span::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw input:checked+span{background:var(--ok)} .sw input:checked+span::after{transform:translateX(20px)}
.mmrow{display:flex;gap:8px;align-items:center}
.mmrow .f{width:84px;flex:0 0 auto}
.mmrow .f label{display:block;font-size:11.5px;color:var(--muted);text-align:center}
.mmrow input{text-align:center;font-weight:700;padding:8px 4px}
.item.dirty{background:#fffbe8;border-left-color:#f5b94a}
.field{margin:8px 0} .field label{display:block;font-size:13.5px;color:var(--muted);margin-bottom:3px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
#modal{position:fixed;inset:0;z-index:90;display:none;align-items:flex-end;justify-content:center;background:rgba(74,63,85,.45);padding:0}
#modal.show{display:flex}
.sheet{background:#fff;border-radius:26px 26px 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));width:100%;max-width:720px;max-height:88vh;overflow:auto}
.sheet h3{margin:0 0 6px;font-size:19px}
.sheet .acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap} .sheet .acts .btn{flex:1;min-width:120px}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:70px;z-index:100;background:var(--ink);color:#fff;border-radius:99px;padding:10px 18px;font-size:15px;max-width:90vw;display:none;box-shadow:0 6px 20px rgba(0,0,0,.25);text-align:center}
#toast.show{display:block} #toast.warn{background:#b97400} #toast.err{background:var(--danger)}
#busy{position:fixed;inset:0;z-index:110;background:rgba(255,247,251,.65);display:none;align-items:center;justify-content:center;font-family:'Mali';font-size:18px}
#busy.show{display:flex}
#busy div{background:#fff;border-radius:20px;padding:18px 26px;box-shadow:var(--shadow)}
.alertitem{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.lg{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.lg .ic{font-size:22px} .lg .t{font-size:12.5px;color:var(--muted)}
.lg .d{font-weight:700;white-space:nowrap}
.req-head{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tag{font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px;background:var(--butter);color:var(--warn)}
.tag.done{background:var(--ok-bg);color:var(--ok)} .tag.cancel{background:#eee;color:#666}
.reqln{display:flex;justify-content:space-between;gap:10px;font-size:14.5px;padding:3px 0;border-bottom:1px dotted var(--line)}
#print{display:none}
@media print{
  body{background:#fff} body>*:not(#print){display:none!important}
  #print{display:block!important;color:#000;font-family:'Sarabun',sans-serif;font-size:13pt}
  #print h2{margin:0 0 4px;text-align:center} #print table{width:100%;border-collapse:collapse;margin:8px 0}
  #print th,#print td{border:1px solid #444;padding:4px 6px;text-align:left;vertical-align:top} #print td.n,#print th.n{text-align:right}
  #print .sig{display:flex;justify-content:space-between;margin-top:36px} #print .sig div{width:45%;text-align:center}
}
.btn.scan{background:linear-gradient(135deg,#8e6df0,#b57cf6);color:#fff;font-size:17px;min-height:56px;box-shadow:0 4px 12px rgba(142,109,240,.35);margin:6px 0 2px}
.m8{background:#f3e3ff}
input.ck{width:24px;height:24px;min-height:0;padding:0;flex:0 0 auto;margin:2px 0 0;accent-color:#8e6df0}
#scan{position:fixed;inset:0;z-index:80;background:#14101c;color:#fff;display:none;flex-direction:column}
#scan.show{display:flex}
.sc-top{display:flex;align-items:center;gap:8px;padding:calc(8px + env(safe-area-inset-top)) 12px 8px}
.sc-top .t{flex:1;min-width:0;font-family:'Mali','Sarabun',sans-serif;font-weight:700;font-size:16px}
.sc-btn{border:0;border-radius:12px;background:rgba(255,255,255,.18);color:#fff;padding:8px 14px;min-height:40px;font-weight:600}
.sc-cam{position:relative;flex:1 1 0;min-height:120px;background:#000;overflow:hidden}
.sc-cam video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.sc-cam.off video,.sc-cam.off .sc-frame{display:none}
.sc-cam.off{flex:0 0 auto;min-height:0}
.sc-cam.off~.sc-bot{flex:1 1 auto;max-height:none}
.sc-frame{position:absolute;left:10%;right:10%;top:22%;bottom:22%;border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.32);pointer-events:none;transition:border-color .15s}
.sc-frame.hit{border-color:#4ccb9a} .sc-frame.bad{border-color:#ff7a93}
.sc-msg{position:absolute;left:12px;right:12px;bottom:8px;text-align:center;font-size:14px;text-shadow:0 1px 3px #000}
.sc-cam.off .sc-msg{position:static;padding:14px 16px;font-size:15px;line-height:1.5;text-shadow:none}
.sc-bot{background:#fff;color:var(--ink);border-radius:22px 22px 0 0;padding:12px 14px calc(12px + env(safe-area-inset-bottom));max-height:56vh;overflow:auto;flex:0 0 auto}
.sc-last{display:flex;gap:10px;align-items:center;background:var(--ok-bg);border-radius:16px;padding:10px 12px}
.sc-last.bad{background:var(--danger-bg)}
.sc-last .stepper button{width:44px;height:44px;font-size:22px}
.sc-q{font-family:'Mali';font-size:24px;min-width:36px;text-align:center}
.sc-tools{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center}
.sc-tools input{flex:1 1 150px;width:auto;min-width:0}
.sc-res{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px dashed var(--line)}
.sc-demo{margin-top:10px;background:var(--butter);border-radius:14px;padding:8px 10px;font-size:13px}
.sc-demo .chip{margin:3px 4px 0 0;min-height:32px;padding:3px 10px;font-size:13px}
.lbls{display:grid;grid-template-columns:repeat(3,1fr);gap:0;color:#000}
.lb{display:flex;gap:2.5mm;align-items:center;border:.3mm dashed #888;padding:2mm;height:34mm;box-sizing:border-box;break-inside:avoid;overflow:hidden;background:#fff}
.lb .qr{width:26mm;height:26mm;flex:0 0 26mm}
.lb .qr svg{display:block;width:100%;height:100%}
.lb .tx{min-width:0;font-size:9.5pt;line-height:1.25}
.lb .tx b{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;word-break:break-word}
.lb .tx small{display:block;font-size:8pt;color:#333;margin-top:1px}
@media print{@page{size:A4;margin:8mm}}
</style>
</head>

<div id="app"></div>
<div id="modal"></div>
<div id="toast"></div>
<div id="busy"><div>🌸 กำลังบันทึก…</div></div>
<div id="print"></div>
<div id="scan"></div>

function $(sel) { return document.querySelector(sel); }
function esc(s) {

    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}

}
function lsGet(k) { try { return localStorage.getItem('stk_' + k); } catch (e) { return null; } }

function pad2(n) { return (n < 10 ? '0' : '') + n; }
function todayStr() { var d = new Date(); return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function shortTime(s) { // 'yyyy-MM-dd HH:mm:ss' → 'วันนี้ 08:12' / '12/11 08:12'
  if (!s) return '';
  var d = s.substring(0, 10), t = s.substring(11, 16);
  return d === todayStr() ? 'วันนี้ ' + t : d.substring(8, 10) + '/' + d.substring(5, 7) + ' ' + t;
}

function busy(on) { S.busy = on; $('#busy').className = on ? 'show' : ''; }
function call(name, payload, ok) {
  busy(true);
  api(name, payload === undefined ? [] : [payload]).then(function (res) {
    busy(false);
    if (res && res.items && res.ver !== undefined) applyState(res);
    if (ok) ok(res);
  }).catch(function (err) {
    busy(false);
    var m = errMsg(err);
    if (/PIN|รหัส/.test(m)) { S.pin = null; render(); }
    showModal('<h3>😿 ทำรายการไม่สำเร็จ</h3><p>' + esc(m) + '</p><div class="acts"><button class="btn primary" data-act="closeModal">เข้าใจแล้ว</button></div>');
  });
}
function applyState(st) {
  S.items = st.items; S.byCode = {};
  st.items.forEach(function (it) { S.byCode[it.code] = it; });
  S.staff = st.staff; S.settings = st.settings; S.reqLines = st.reqLines; S.barcodes = st.barcodes || {}; S.ver = st.ver;
  S.loaded = true; S.error = ''; S.online = true; S.lastSync = new Date();
  render();
}
function poll(force) {
  if (S.busy || document.hidden || !S.loaded) return;
  if (Date.now() - S.lastActive > IDLE_MS) { if (!S.idle) { S.idle = true; updateSync(); } return; }
  S.polls++;
  var v = (force || S.polls % 10 === 0) ? null : S.ver;
  api('getState', [v]).then(function (st) {
    S.online = true; S.lastSync = new Date();
    if (st.unchanged) updateSync(); else applyState(st);
  }).catch(function () { S.online = false; updateSync(); });
}
function syncText() {
  if (!S.lastSync) return '';
  if (S.idle) return '<b>⏸</b> พักการอัปเดต<br>แตะหน้าจอเพื่ออัปเดตต่อ';
  var t = pad2(S.lastSync.getHours()) + ':' + pad2(S.lastSync.getMinutes()) + ':' + pad2(S.lastSync.getSeconds());
  return S.online ? '<b>●</b> เรียลไทม์<br>อัปเดต ' + t : '<b>○</b> ขาดการเชื่อมต่อ<br>ล่าสุด ' + t;
}
function updateSync() {
  var el = document.querySelector('.sync');
  if (el) { el.className = 'sync ' + (S.online ? 'on' : 'off'); el.innerHTML = syncText(); }
}

/* ---------- สถานะวัสดุ / Min-Max ---------- */
function statusOf(it) {
  if (!it.active) return 'inactive';
  if (it.onHand === null) return 'unknown';
  if (it.onHand <= 0) return 'out';
  if (it.onHand <= it.min) return 'low';
  if (it.onHand <= it.min + (it.max - it.min) * S.settings.nearPct / 100) return 'near';
  if (it.onHand > it.max) return 'over';
  return 'ok';
}
function isNeed(it) { var s = statusOf(it); return s === 'out' || s === 'low'; }
function pendingOf(code) {
  var n = 0;
  S.reqLines.forEach(function (l) { if (l.code === code && l.status === PENDING) n += l.qty; });
  return n;
}
function suggestQty(it) { return Math.max(0, Math.ceil(it.max - (it.onHand || 0) - pendingOf(it.code) - 1e-9)); }
/* สูตรเดียวกับที่ใช้สร้างค่าตั้งต้นใน SeedData.gs */
function calcMinMax(annual, group, minDays, maxDays) {
  if (!(annual > 0)) return null;
  var mn = Math.ceil(annual * minDays / 365 - 1e-9), mx = Math.ceil(annual * maxDays / 365 - 1e-9);
  if (MEDICAL[group]) mn = Math.max(mn, 1); else if (annual < 12) mn = 0;
  if (mx <= mn) mx = mn + 1;
  return { min: mn, max: mx };
}
function badge(st) { return '<span class="badge s-' + st + '">' + ST[st].i + ' ' + ST[st].l + '</span>'; }
function barHtml(it) {
  if (it.onHand === null || !it.max) return '<div class="bar"><i style="width:0"></i></div>';
  var pct = Math.min(100, Math.max(0, it.onHand / it.max * 100)), mp = Math.min(100, it.min / it.max * 100);
  return '<div class="bar b-' + statusOf(it) + '"><i style="width:' + pct.toFixed(1) + '%"></i><u style="left:' + mp.toFixed(1) + '%"></u></div>';
}
function counts() {
  var c = { need: 0, near: 0, ok: 0, unknown: 0, total: 0 };
  S.items.forEach(function (it) {
    if (!it.active) return;
    c.total++;
    var s = statusOf(it);
    if (s === 'out' || s === 'low') c.need++; else if (s === 'near') c.near++; else if (s === 'unknown') c.unknown++; else c.ok++;
  });
  return c;
}

/* ---------- การกรองรายการ ---------- */
function filtered(o) {
  var q = S.q.trim().toLowerCase();
  var list = S.items.filter(function (it) {
    if (!(o && o.inactive) && !it.active) return false;
    if (S.grp && it.group !== S.grp) return false;
    if (q && (it.name + ' ' + it.code).toLowerCase().indexOf(q) < 0) return false;
    if (o && o.status) {
      var s = statusOf(it);
      if (S.stFilter === 'need' && !(s === 'out' || s === 'low')) return false;
      if (S.stFilter === 'near' && s !== 'near') return false;
      if (S.stFilter === 'ok' && s !== 'ok') return false;
      if (S.stFilter === 'over' && s !== 'over') return false;
      if (S.stFilter === 'unknown' && s !== 'unknown') return false;
    }
    if (o && o.uncounted && S.onlyUncounted && it.lastCount && it.lastCount.substring(0, 10) === todayStr()) return false;
    return true;
  });
  if (o && o.sev) {
    var idx = {}; S.items.forEach(function (it, i) { idx[it.code] = i; });
    list.sort(function (a, b) { return (SEV[statusOf(a)] - SEV[statusOf(b)]) || (idx[a.code] - idx[b.code]); });
  }
  return list;
}

/* ---------- นับสต็อก ---------- */
function diffHtml(it, v) {
  if (v === '' || v === undefined) return '';
  var n = parseNum(v);
  if (n === null || isNaN(n)) return '<span class="diff down">ตัวเลขไม่ถูกต้อง</span>';
  if (it.onHand === null) return '<span class="diff init">ยอดตั้งต้น</span>';
  var d = Math.round((n - it.onHand) * 100) / 100;
  if (d === 0) return '<span class="diff eq">✓ ตรงกับระบบ</span>';
  return '<span class="diff ' + (d > 0 ? 'up' : 'down') + '">' + (d > 0 ? '+' : '−') + fmt(Math.abs(d)) + ' จากระบบ</span>';
}
function draftCount() {
  var n = 0;
  Object.keys(S.draft).forEach(function (k) { if (S.draft[k] !== '' && S.draft[k] !== undefined) n++; });
  return n;
}

  return h + '</div>';

function pendingReqs() {
  var m = {}, order = [];
  S.reqLines.forEach(function (l) {

    if (!m[l.reqNo]) { m[l.reqNo] = []; order.push(l.reqNo); }
    m[l.reqNo].push(l);

  order.sort().reverse();
  return order.map(function (no) { return { no: no, lines: m[no] }; });
}

function scanOpen(mode) {

function scanFromFile(file) {
  if (!file) return;
  setCamMsg('กำลังอ่านรูป…');
  var url = URL.createObjectURL(file), img = new Image();
  img.onload = function () {
    var cv = document.createElement('canvas'), k = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight));
    cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(url);
    getDecoder().then(function (dec) { return dec(cv); }).then(function (txt) {
      setCamMsg(SC.running ? 'เล็งบาร์โค้ด / QR ให้อยู่ในกรอบ' : (SC.camErr ? '📷 ' + SC.camErr + '\nใช้ปุ่ม “ถ่ายรูปบาร์โค้ด” หรือพิมพ์รหัสด้านล่างแทนได้ค่ะ' : ''));

    }).catch(function (e) { setCamMsg(''); toast(errMsg(e), 'err'); });
  };
  img.onerror = function () { URL.revokeObjectURL(url); toast('เปิดรูปไม่ได้', 'err'); };
  img.src = url;
}

      e.preventDefault();
      var m = S.screen === 'take' ? 'take' : 'recv';
      setQty(m, it.code, curQty(m, it.code) + 1); S.q = ''; render(); toast('เพิ่ม ' + it.name + ' แล้ว 🧺');
    }
  }
});
document.addEventListener('visibilitychange', function () {
  if (document.hidden) { if (SC.open) camStop(); return; }
  S.lastActive = Date.now(); S.idle = false; poll(true);
  if (SC.open) scanBegin();
});
['click', 'input', 'touchstart', 'keydown'].forEach(function (ev) {
  document.addEventListener(ev, function () {
    S.lastActive = Date.now();
    if (S.idle) { S.idle = false; updateSync(); poll(true); }
  }, { passive: true, capture: true });
});

/* ---------- เริ่มต้น ---------- */
var timer = null;
function boot() {
  render();
  api('getState', [null]).then(function (st) {
    applyState(st);
    clearInterval(timer);
    timer = setInterval(poll, Math.max(5, st.settings.pollSec) * 1000);
  }).catch(function (e) { S.error = errMsg(e); S.loaded = false; render(); });
}
boot();
})();
</script>
</body>
